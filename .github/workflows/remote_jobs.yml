name: Jobs + Company Email Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,7,11,15,19,23 * * *'

permissions:
  contents: read

jobs:
  scrape:
    name: Jobs + spontaneous company discovery
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Discover jobs and spontaneous-company targets
        env:
          GOOGLE_SHEET_WEBHOOK_URL: \${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: python remote_scraper.py --mode scrape
