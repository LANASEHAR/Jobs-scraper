name: Jobs + Company Email Scraper (4h30 Session)

on:
  workflow_dispatch:  # Permet de lancer le scraper manuellement avec un clic
  schedule:
    - cron: '0 6 * * *'  # Se lance automatiquement chaque jour à 06:00 UTC

concurrency:
  group: remote-jobs-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape LinkedIn, Indeed, Remote APIs & Extract Emails
    runs-on: ubuntu-latest
    timeout-minutes: 270  # 4h30 d'exécution continue maximum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Engine (4h30)
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          MAX_RUNTIME_HOURS: 4.5
        run: |
          python remote_scraper.py
