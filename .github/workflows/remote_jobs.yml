name: Jobs + Company Email Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: read

jobs:
  discover:
    name: LinkedIn + Indeed + Casablanca company discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Discover fresh jobs and spontaneous company opportunities
        env:
          GOOGLE_SHEET_WEBHOOK_URL: \${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: python remote_scraper.py --mode scrape

  enrich:
    name: Find company websites + public recruiting emails
    needs: discover
    if: \${{ needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Deep search every pending company
        env:
          GOOGLE_SHEET_WEBHOOK_URL: \${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          DEEP_LIMIT: '200'
          PYTHONUNBUFFERED: '1'
        run: python remote_scraper.py --mode deep
