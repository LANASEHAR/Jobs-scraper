name: Jobs + Company Email Scraper

on:
  push:
    branches: [main]
    paths:
      - 'remote_scraper.py'
      - 'email_enricher.py'
      - '.github/workflows/remote_jobs.yml'
      - 'requirements.txt'
  workflow_dispatch:
  # Two scheduled runs per day; allow discovery and email enrichment to finish.
  schedule:
    - cron: '13 5 * * *'
    - cron: '37 17 * * *'

concurrency:
  group: remote-jobs-scraper
  # Keep the active scrape running when another trigger arrives.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Jobs + spontaneous company discovery
    runs-on: ubuntu-latest
    # Discovery can use up to 40 minutes; the second pass needs its own budget.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate scraper syntax
        run: python -m py_compile remote_scraper.py email_enricher.py
      - name: Discover jobs, then hunt Casablanca companies
        timeout-minutes: 50
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          for attempt in 1 2 3; do
            echo "Discovery attempt $attempt/3"
            python remote_scraper.py --mode scrape && exit 0
            [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
          done
          exit 1

      - name: Second-pass company and email enrichment
        timeout-minutes: 90
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          for attempt in 1 2 3; do
            echo "Email enrichment attempt $attempt/3"
            python email_enricher.py && exit 0
            [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
          done
          exit 1
