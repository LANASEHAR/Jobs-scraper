name: Remote Jobs Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Discover LinkedIn remote jobs
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          LINKEDIN_MAX_PAGES: '3'
        run: python remote_scraper.py --mode scrape

  deep-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Enrich pending jobs with company-site deep search
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          DEEP_LIMIT: '100'
        run: python remote_scraper.py --mode deep
