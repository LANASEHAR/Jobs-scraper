name: Jobs + Company Email Scraper

on:
  workflow_dispatch:
  # Two complete runs per day only. 4h30 is the maximum run budget, not the frequency.
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'

concurrency:
  group: remote-jobs-scraper
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scrape:
    name: Jobs + spontaneous company discovery
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Discover jobs, then hunt Casablanca companies
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: python remote_scraper.py --mode scrape
