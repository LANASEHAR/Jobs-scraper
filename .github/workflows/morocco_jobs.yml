name: Morocco Casablanca Email Finder

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'

jobs:
  email-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Find matching companies and public recruitment emails
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: python morocco_jobs.py --mode email
